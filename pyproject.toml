[project]
name = "orchestrator-lg"
version = "0.1.0"
description = "agency-orchestrator 的 LangGraph 版核心引擎原型：YAML 工作流 → StateGraph（checkpoint / HITL / 循环上限）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
